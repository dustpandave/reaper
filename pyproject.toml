[project]
name = "reaper-agent"
version = "0.1.0"
description = "MCP server that lets AI agents drive the REAPER DAW: project control, MIDI idea generation, ReaScript, render and analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "anyio>=4",
  "pydantic>=2",
  "numpy>=1.26",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "lupa>=2"]

[project.scripts]
reaper-agent = "reaper_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reaper_agent"]
